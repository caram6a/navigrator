services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-navigrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-navigrator_password}
      POSTGRES_DB: ${POSTGRES_DB:-navigrator}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-navigrator}:${POSTGRES_PASSWORD:-navigrator_password}@db:5432/${POSTGRES_DB:-navigrator}?schema=public
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-secret-change-in-production}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_API_URL: http://backend:4000
    depends_on:
      - backend

networks:
  default:
    driver: bridge

volumes:
  postgres_data: